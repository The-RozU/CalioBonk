name: Import CalioBonk v0.0.3 and publish

on:
  push:
    branches: [dev-mode]
    paths:
      - '.import/part-*.b64'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: caliobonk-bootstrap
  cancel-in-progress: false

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout dev-mode
        uses: actions/checkout@v4
        with:
          ref: dev-mode

      - name: Verify and unpack original game sources
        shell: bash
        run: |
          cat .import/part-{1..4}.b64 | base64 --decode > /tmp/caliobonk-source.tar.xz
          echo "876feb87b61ba5e600287c8da4fbe41fd213457c40304c7de7315e66d7927007  /tmp/caliobonk-source.tar.xz" | sha256sum -c -
          tar -tJf /tmp/caliobonk-source.tar.xz >/dev/null
          tar -xJf /tmp/caliobonk-source.tar.xz -C /tmp
          cp -a /tmp/CalioBonk/. .
          rm -rf .import

      - name: Commit expanded source files to dev-mode only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import CalioBonk v0.0.3 game sources"
            git push origin HEAD:dev-mode
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project
        run: npm run check:assets

      - name: Build production game
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
